appId: com.focusdesk.app
productName: Focus Desk
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
# The native helper (D-038). Built by `npm run build:helper`, found at runtime
# under process.resourcesPath.
extraResources:
  - from: resources/focusdesk-helper
    to: focusdesk-helper
mac:
  # Drawn by build/make_icon.py, so it can be edited as code rather than redrawn.
  icon: build/icon.icns
  # Unsigned/ad-hoc: fine for installing on this machine, but a downloaded copy
  # would be blocked by Gatekeeper until the app is signed and notarised.
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.productivity
