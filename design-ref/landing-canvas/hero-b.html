<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Desk — hero B</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
<style>
  /* B: 종이 위에 물건을 늘어놓은 책상. 위젯은 밝은 방의 값을 쓴다 */
  .hero { height: 100vh; min-height: 720px; position: relative; }
  .w.light {
    background: #f7f6f3;
    box-shadow: 0 0 0 1px rgba(30,28,25,.12), 0 0 0 2.5px rgba(255,255,255,.7),
                0 1px 2px rgba(46,38,28,.10), 0 12px 26px -10px rgba(46,38,28,.22), 0 32px 60px -30px rgba(46,38,28,.3);
  }
  .w.light .w-head { color: #8b8479; }
  .w.light .bar { background: rgba(30,28,25,.13); }
  .w.light .bar.lead { background: rgba(30,28,25,.62); }
  .w.light .check { border-color: rgba(30,28,25,.28); }
  .w.light .plate { background: rgba(30,28,25,.07); }
  .hero-copy { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(900px,64vw); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .hero-copy p { color: var(--ink-2); max-width: 540px; }
  .field.on-paper { width: 260px; }
  .photo-card { position: absolute; border-radius: 16px; overflow: hidden; background-size: cover; background-position: center;
    box-shadow: 0 0 0 1px rgba(30,28,25,.12), 0 0 0 2.5px rgba(255,255,255,.7), 0 18px 40px -14px rgba(46,38,28,.35); }
  @media (max-width: 1080px) { .hero .w, .photo-card { display: none; } .hero-copy { width: 86vw; } }
</style>
</head>
<body>
<section class="hero paper">
  <div class="bar-top" style="color:var(--ink)">
    <div class="mark" style="color:var(--ink)">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><rect x="1.2" y="1.2" width="17.6" height="17.6" rx="4.4" stroke="currentColor" stroke-width="1.3"/><rect x="4.7" y="4.7" width="8.2" height="8.2" rx="2.2" fill="currentColor"/><rect x="11.3" y="11.3" width="4.1" height="4.1" rx="1.2" fill="#e9a23b"/></svg>
      <span style="font-size:15px;font-weight:600">Focus Desk</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="label" style="color:var(--ink-3)">macOS</span>
      <button class="cta" style="height:40px;font-size:14px;padding:0 18px">Join the waitlist</button>
    </div>
  </div>

  <div class="w light settle" style="left:5%;top:19%;width:280px;transform:rotate(-2.4deg);animation-delay:120ms">
    <div class="w-head">Notes</div>
    <div class="w-body"><div class="bar lead" style="width:62%"></div><div class="bar"></div><div class="bar" style="width:92%"></div><div class="bar" style="width:70%"></div></div>
  </div>

  <div class="photo-card settle" style="left:13%;bottom:12%;width:330px;height:206px;transform:rotate(1.7deg);animation-delay:300ms;background-image:url(../../public/wallpapers/rainy-attic.webp)">
    <span class="label" style="position:absolute;left:0;right:0;bottom:0;padding:12px 14px;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.6),transparent)">Rainy Attic</span>
  </div>

  <div class="w light settle" style="right:6.5%;top:16%;width:240px;transform:rotate(2deg);animation-delay:220ms">
    <div class="w-head">To do</div>
    <div class="w-body" style="gap:13px">
      <div class="row"><span class="check on"></span><span class="bar" style="flex-grow:1;opacity:.5"></span></div>
      <div class="row"><span class="check"></span><span class="bar" style="flex-grow:1"></span></div>
      <div class="row"><span class="check"></span><span class="bar" style="width:66%"></span></div>
    </div>
  </div>

  <div class="w light settle" style="right:9%;bottom:15%;width:300px;transform:rotate(-1.2deg);animation-delay:420ms">
    <div class="w-head">figma.com</div>
    <div style="padding:0 12px 12px;display:flex;flex-direction:column;gap:9px">
      <div class="plate" style="height:24px"></div><div class="plate" style="height:96px"></div>
    </div>
  </div>

  <div class="w light settle" style="left:32%;top:9%;width:150px;transform:rotate(1.2deg);animation-delay:520ms">
    <div class="w-head">Timer</div>
    <div style="height:92px;display:flex;align-items:center;justify-content:center"><span class="mono" style="font-size:30px;letter-spacing:-.03em">24:00</span></div>
  </div>

  <div class="hero-copy">
    <h1 class="display">Your ideas deserve their own spaces.</h1>
    <p class="lead">A desktop where every project keeps its own tabs, notes and tools — exactly where you left them.</p>
    <div style="display:flex;gap:10px;align-items:center"><div class="field on-paper">[YOUR EMAIL]</div><button class="cta">Join the waitlist</button></div>
    <span class="label" style="color:var(--ink-3)">macOS only · Shipping [LAUNCH DATE]</span>
  </div>
</section>
</body>
</html>
