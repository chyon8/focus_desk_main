<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Desk — hero C</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
<style>
  /* C: 방을 넓게 두고 글자는 아래 왼쪽. 위젯은 오른쪽에 실제 책상처럼 모여 있다 */
  .hero { height: 100vh; min-height: 720px; }
  .room-scrim { background: linear-gradient(to right, rgba(10,8,6,.72) 0%, rgba(10,8,6,.34) 42%, transparent 68%),
                            linear-gradient(to top, rgba(10,8,6,.5), transparent 46%); }
  .copy { position: absolute; left: 6%; bottom: 13%; z-index: 3; width: min(620px,46vw); color: var(--room-ink); display: flex; flex-direction: column; gap: 24px; }
  .copy p { color: rgba(246,241,232,.74); max-width: 440px; }
  @media (max-width: 1080px) { .hero .w { display: none; } .copy { width: 84vw; left: 8%; } }
</style>
</head>
<body>
<section class="room hero">
  <div class="room-layer on" style="background-image:url(../../public/wallpapers/snowy-railway-halt.webp)"></div>
  <div class="room-scrim"></div>
  <div class="grain"></div>

  <div class="bar-top">
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><rect x="1.2" y="1.2" width="17.6" height="17.6" rx="4.4" stroke="currentColor" stroke-width="1.3"/><rect x="4.7" y="4.7" width="8.2" height="8.2" rx="2.2" fill="currentColor"/><rect x="11.3" y="11.3" width="4.1" height="4.1" rx="1.2" fill="#e9a23b"/></svg>
      <span style="font-size:15px;font-weight:600">Focus Desk</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="chip">macOS</span>
      <button class="cta" style="height:40px;font-size:14px;padding:0 18px">Join the waitlist</button>
    </div>
  </div>

  <div class="w settle" style="right:5%;top:17%;width:420px;animation-delay:140ms">
    <div class="w-head">Notes</div>
    <div class="w-body"><div class="bar lead" style="width:58%"></div><div class="bar"></div><div class="bar" style="width:94%"></div><div class="bar" style="width:88%"></div><div class="bar" style="width:64%"></div><div class="bar" style="width:92%"></div></div>
  </div>
  <div class="w settle" style="right:29%;top:36%;width:250px;animation-delay:300ms">
    <div class="w-head">To do</div>
    <div class="w-body" style="gap:13px">
      <div class="row"><span class="check on"></span><span class="bar" style="flex-grow:1;opacity:.45"></span></div>
      <div class="row"><span class="check"></span><span class="bar" style="flex-grow:1"></span></div>
    </div>
  </div>
  <div class="w settle" style="right:7%;bottom:14%;width:330px;animation-delay:440ms">
    <div class="w-head">figma.com</div>
    <div style="padding:0 12px 12px;display:flex;flex-direction:column;gap:9px"><div class="plate" style="height:24px"></div><div class="plate" style="height:104px"></div></div>
  </div>

  <div class="copy">
    <h1 class="display">Your ideas deserve their own spaces.</h1>
    <p class="lead">A desktop where every project keeps its own tabs, notes and tools — exactly where you left them.</p>
    <div style="display:flex;gap:10px;align-items:center"><div class="field">[YOUR EMAIL]</div><button class="cta">Join the waitlist</button></div>
    <span class="label" style="color:rgba(246,241,232,.5)">macOS only · Shipping [LAUNCH DATE]</span>
  </div>

  <span class="chip" style="position:absolute;right:28px;bottom:26px;z-index:5">Snowy Railway</span>
</section>
</body>
</html>
