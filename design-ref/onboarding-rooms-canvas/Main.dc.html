<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #14110d; font-family: 'Instrument Sans', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #f7f6f3; } a:hover { color: #e9a23b; }
    .panel { position: relative; flex: 1 1 0; min-width: 0; overflow: hidden; cursor: pointer; transition: flex-grow 520ms cubic-bezier(0.22, 0.72, 0.16, 1); }
    .panels:not(:hover) .panel.lead, .panel:hover { flex-grow: 3.4; }
    .name-small { transition: opacity 180ms ease; }
    .name-big { opacity: 0; transform: translateY(8px); transition: opacity 320ms ease 120ms, transform 320ms ease 120ms; }
    .panels:not(:hover) .panel.lead .name-small, .panel:hover .name-small { opacity: 0; }
    .panels:not(:hover) .panel.lead .name-big, .panel:hover .name-big { opacity: 1; transform: none; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #14110d;">
  <div class="panels" style="position: absolute; inset: 0; display: flex;">
    <div class="panel lead" style="border-right: 3px solid #14110d;"><img src="summer-lake.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%; display: block;">
      <div style="position: absolute; inset: 0; background-image: linear-gradient(to bottom, rgba(20,17,13,0.62) 0%, rgba(20,17,13,0) 32%), linear-gradient(to top, rgba(20,17,13,0.7) 0%, rgba(20,17,13,0) 36%);"></div>
      <span class="name-small" style="position: absolute; left: 16px; bottom: 18px; font-size: 14px; font-weight: 500; white-space: nowrap; color: #f7f6f3;">Summer Lake</span>
      <span class="name-big" style="position: absolute; left: 32px; bottom: 32px; font-size: 34px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; white-space: nowrap; color: #f7f6f3;">Summer Lake</span>
    </div>
    <div class="panel" style="border-right: 3px solid #14110d;"><img src="rainy-attic.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 55% 50%; display: block;">
      <div style="position: absolute; inset: 0; background-image: linear-gradient(to bottom, rgba(20,17,13,0.62) 0%, rgba(20,17,13,0) 32%), linear-gradient(to top, rgba(20,17,13,0.7) 0%, rgba(20,17,13,0) 36%);"></div>
      <span class="name-small" style="position: absolute; left: 16px; bottom: 18px; font-size: 14px; font-weight: 500; white-space: nowrap; color: #f7f6f3;">Rainy Attic</span>
      <span class="name-big" style="position: absolute; left: 32px; bottom: 32px; font-size: 34px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; white-space: nowrap; color: #f7f6f3;">Rainy Attic</span>
    </div>
    <div class="panel" style="border-right: 3px solid #14110d;"><img src="midnight-observatory.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 84% 50%; display: block;">
      <div style="position: absolute; inset: 0; background-image: linear-gradient(to bottom, rgba(20,17,13,0.62) 0%, rgba(20,17,13,0) 32%), linear-gradient(to top, rgba(20,17,13,0.7) 0%, rgba(20,17,13,0) 36%);"></div>
      <span class="name-small" style="position: absolute; left: 16px; bottom: 18px; font-size: 14px; font-weight: 500; white-space: nowrap; color: #f7f6f3;">Midnight Observatory</span>
      <span class="name-big" style="position: absolute; left: 32px; bottom: 32px; font-size: 34px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; white-space: nowrap; color: #f7f6f3;">Midnight Observatory</span>
    </div>
    <div class="panel" style="border-right: 3px solid #14110d;"><img src="snowy-railway.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%; display: block;">
      <div style="position: absolute; inset: 0; background-image: linear-gradient(to bottom, rgba(20,17,13,0.62) 0%, rgba(20,17,13,0) 32%), linear-gradient(to top, rgba(20,17,13,0.7) 0%, rgba(20,17,13,0) 36%);"></div>
      <span class="name-small" style="position: absolute; left: 16px; bottom: 18px; font-size: 14px; font-weight: 500; white-space: nowrap; color: #f7f6f3;">Snowy Railway</span>
      <span class="name-big" style="position: absolute; left: 32px; bottom: 32px; font-size: 34px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; white-space: nowrap; color: #f7f6f3;">Snowy Railway</span>
    </div>
    <div class="panel" style="background-color: #efe7d9; background-image: linear-gradient(rgba(120,96,62,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(120,96,62,0.09) 1px, transparent 1px); background-size: 44px 44px;">
      <span class="name-small" style="position: absolute; left: 16px; bottom: 18px; font-size: 14px; font-weight: 500; white-space: nowrap; color: #201e1b;">Paper</span>
      <span class="name-big" style="position: absolute; left: 32px; bottom: 32px; font-size: 34px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; white-space: nowrap; color: #201e1b;">Paper</span>
    </div>
  </div>
  <div style="position: absolute; left: 48px; top: 48px; width: 760px; pointer-events: none;">
    <h1 style="margin: 0; font-size: 34px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; color: #f7f6f3;">Afternoon. Where do you want to work?</h1>
    <p style="margin: 12px 0 0; font-size: 14px; line-height: 1.625; color: rgba(247,246,243,0.72);">A space is somewhere you are. This one is yours, and you can change it any time.</p>
  </div>
</div>
</x-dc>
</body>
</html>
