<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #16120f; font-family: 'Instrument Sans', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #f7f6f3; } a:hover { color: #e9a23b; }
    .card { cursor: pointer; transition: transform 240ms ease; }
    .card:hover { transform: translateY(-4px); }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #16120f;">
  <div style="position: absolute; left: -80px; top: -80px; right: -80px; bottom: -80px; filter: blur(64px) saturate(1.1); opacity: 0.22;"><img src="summer-lake.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block;"></div>
  <div style="position: absolute; left: 120px; top: 84px; width: 1200px;">
    <h1 style="margin: 0; font-size: 34px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; color: #f7f6f3;">Afternoon. Where do you want to work?</h1>
    <p style="margin: 12px 0 0; font-size: 14px; line-height: 1.625; color: rgba(247,246,243,0.72);">A space is somewhere you are. This one is yours, and you can change it any time.</p>
    <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
      <div class="card" style="grid-column: span 4; position: relative; height: 440px; overflow: hidden; border-radius: 16px; border: 1px solid rgba(247,246,243,0.1); box-shadow: 0 24px 56px -24px rgba(0,0,0,0.8), inset 0 1px 0 rgba(247,246,243,0.07);"><img src="summer-lake.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; display: block;">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 36%; background-image: linear-gradient(to top, rgba(20,17,13,0.7), transparent);"></div>
        <span style="position: absolute; left: 22px; bottom: 18px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: #f7f6f3;">Summer Lake</span>
      </div>
      <div class="card" style="position: relative; height: 184px; overflow: hidden; border-radius: 16px; border: 1px solid rgba(247,246,243,0.1); box-shadow: 0 18px 40px -18px rgba(0,0,0,0.8), inset 0 1px 0 rgba(247,246,243,0.07);"><img src="rainy-attic.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block;">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background-image: linear-gradient(to top, rgba(20,17,13,0.7), transparent);"></div>
        <span style="position: absolute; left: 14px; bottom: 12px; font-size: 14px; font-weight: 500; color: #f7f6f3;">Rainy Attic</span>
      </div>
      <div class="card" style="position: relative; height: 184px; overflow: hidden; border-radius: 16px; border: 1px solid rgba(247,246,243,0.1); box-shadow: 0 18px 40px -18px rgba(0,0,0,0.8), inset 0 1px 0 rgba(247,246,243,0.07);"><img src="midnight-observatory.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 84% 50%; display: block;">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background-image: linear-gradient(to top, rgba(20,17,13,0.7), transparent);"></div>
        <span style="position: absolute; left: 14px; bottom: 12px; font-size: 14px; font-weight: 500; color: #f7f6f3;">Midnight Observatory</span>
      </div>
      <div class="card" style="position: relative; height: 184px; overflow: hidden; border-radius: 16px; border: 1px solid rgba(247,246,243,0.1); box-shadow: 0 18px 40px -18px rgba(0,0,0,0.8), inset 0 1px 0 rgba(247,246,243,0.07);"><img src="snowy-railway.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%; display: block;">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background-image: linear-gradient(to top, rgba(20,17,13,0.7), transparent);"></div>
        <span style="position: absolute; left: 14px; bottom: 12px; font-size: 14px; font-weight: 500; color: #f7f6f3;">Snowy Railway</span>
      </div>
      <div class="card" style="position: relative; height: 184px; overflow: hidden; border-radius: 16px; border: 1px solid rgba(247,246,243,0.1); box-shadow: 0 18px 40px -18px rgba(0,0,0,0.8), inset 0 1px 0 rgba(247,246,243,0.07); background-color: #efe7d9; background-image: linear-gradient(rgba(120,96,62,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(120,96,62,0.09) 1px, transparent 1px); background-size: 44px 44px;">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background-image: linear-gradient(to top, rgba(247,246,243,0.75), transparent);"></div>
        <span style="position: absolute; left: 14px; bottom: 12px; font-size: 14px; font-weight: 500; color: #201e1b;">Paper</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
