<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #efe7d9; font-family: 'Instrument Sans', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #201e1b; } a:hover { color: #a9581b; }
    .print { position: absolute; overflow: hidden; border-radius: 16px; background-size: cover; background-position: center; cursor: pointer; transform: rotate(var(--r)); box-shadow: 0 0 0 1px rgba(30,28,25,0.12), 0 0 0 2.5px rgba(255,255,255,0.7), 0 18px 40px -14px rgba(46,38,28,0.35); transition: transform 380ms cubic-bezier(0.22, 0.72, 0.16, 1), box-shadow 380ms ease; }
    .print:hover { transform: rotate(0deg) scale(1.03); z-index: 10 !important; box-shadow: 0 0 0 1px rgba(30,28,25,0.12), 0 0 0 2.5px rgba(255,255,255,0.85), 0 32px 64px -22px rgba(46,38,28,0.45); }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background-color: #efe7d9; background-image: linear-gradient(rgba(120,96,62,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(120,96,62,0.09) 1px, transparent 1px); background-size: 44px 44px;">
  <div style="position: absolute; left: 100px; top: 88px; width: 620px;">
    <h1 style="margin: 0; font-size: 34px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; color: #201e1b;">Afternoon. Where do you want to work?</h1>
    <p style="margin: 12px 0 0; font-size: 14px; line-height: 1.625; color: rgba(32,30,27,0.72);">A space is somewhere you are. This one is yours, and you can change it any time.</p>
  </div>
  <div class="print" style="--r: 1.8deg; left: 760px; top: 84px; width: 460px; height: 288px;"><img src="rainy-attic.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block;">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background-image: linear-gradient(to top, rgba(20,17,13,0.7), transparent);"></div>
    <span style="position: absolute; left: 16px; bottom: 13px; font-size: 14px; font-weight: 500; color: #f7f6f3;">Rainy Attic</span>
  </div>
  <div class="print" style="--r: -2.2deg; left: 100px; top: 250px; width: 600px; height: 375px; z-index: 1;"><img src="summer-lake.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block;">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 36%; background-image: linear-gradient(to top, rgba(20,17,13,0.7), transparent);"></div>
    <span style="position: absolute; left: 20px; bottom: 16px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: #f7f6f3;">Summer Lake</span>
  </div>
  <div class="print" style="--r: -1.4deg; left: 1010px; top: 402px; width: 330px; height: 206px;"><img src="midnight-observatory.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 84% 50%; display: block;">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background-image: linear-gradient(to top, rgba(20,17,13,0.7), transparent);"></div>
    <span style="position: absolute; left: 14px; bottom: 12px; font-size: 14px; font-weight: 500; color: #f7f6f3;">Midnight Observatory</span>
  </div>
  <div class="print" style="--r: 2.4deg; left: 640px; top: 470px; width: 400px; height: 250px; z-index: 2;"><img src="snowy-railway.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%; display: block;">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background-image: linear-gradient(to top, rgba(20,17,13,0.7), transparent);"></div>
    <span style="position: absolute; left: 14px; bottom: 12px; font-size: 14px; font-weight: 500; color: #f7f6f3;">Snowy Railway</span>
  </div>
  <div class="print" style="--r: -3deg; left: 1116px; top: 664px; width: 250px; height: 156px; background-color: #efe7d9; background-image: linear-gradient(rgba(120,96,62,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(120,96,62,0.12) 1px, transparent 1px); background-size: 22px 22px;">
    <span style="position: absolute; left: 14px; bottom: 12px; font-size: 14px; font-weight: 500; color: #201e1b;">Paper</span>
  </div>
</div>
</x-dc>
</body>
</html>
